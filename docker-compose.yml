# P04 – Assistant de support et tri automatique de tickets (n8n + RAG + LLM)
# Démarrage : cp .env.example .env  (puis adapter)  &&  docker compose up -d
name: p04-support

services:
  # Tickets, base de connaissances vectorielle (pgvector) et source de Grafana
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
      TZ: ${TZ}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/seed_demo.sql:/seed/seed_demo.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # LLM local (CPU) : modèle de chat + modèle d'embeddings
  ollama:
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 2   # chat + embeddings, sans dépasser la RAM
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Téléchargement unique des modèles (≈ 3,5 Go au premier démarrage)
  ollama-init:
    image: ollama/ollama:0.40.16
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama pull ${CHAT_MODEL} && ollama pull ${EMBED_MODEL} && echo 'Modèles prêts.'"
    restart: "no"

  # Boîte mail de test pour le canal e-mail entrant (SMTP 3025 / IMAP 3143)
  greenmail:
    image: greenmail/standalone:2.1.14
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=support:${GREENMAIL_PASSWORD}@support.local
        -Dgreenmail.users.login=email
        -Dgreenmail.verbose=false
    ports:
      - "127.0.0.1:3025:3025"
      - "127.0.0.1:3143:3143"

  # Capture de tous les e-mails sortants (réponses clients, notifications d'escalade)
  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  n8n:
    image: n8nio/n8n:2.44.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    entrypoint: ["tini", "--", "/bin/sh", "/bootstrap/bootstrap.sh"]
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      N8N_PORT: 5678
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5679}/
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_PORT:-5679}/
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_RESTRICT_FILE_ACCESS_TO: /data/kb
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
      # Lues par le bootstrap pour créer les credentials locaux
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GREENMAIL_PASSWORD: ${GREENMAIL_PASSWORD}
      TICKETS_API_KEY: ${TICKETS_API_KEY}
      # Lues par les workflows (expressions $env)
      CHAT_MODEL: ${CHAT_MODEL}
      EMBED_MODEL: ${EMBED_MODEL}
      SUPPORT_FROM_EMAIL: ${SUPPORT_FROM_EMAIL}
      AGENT_EMAIL: ${AGENT_EMAIL}
      CONFIDENCE_MIN: ${CONFIDENCE_MIN}
      SIMILARITY_MIN: ${SIMILARITY_MIN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_AGENT_CHAT_ID: ${TELEGRAM_AGENT_CHAT_ID:-}
      PUBLIC_API_URL: http://localhost:${N8N_PORT:-5679}/webhook
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/bootstrap.sh:/bootstrap/bootstrap.sh:ro
      - ./n8n/workflows:/bootstrap/workflows:ro
      - ./knowledge-base:/data/kb:ro
    ports:
      - "127.0.0.1:${N8N_PORT:-5679}:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  grafana:
    image: grafana/grafana:13.2.6
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_DEFAULT_THEME: light
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: browser
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/support-tickets.json
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

  # Documentation interactive de l'API (Swagger UI)
  swagger:
    image: swaggerapi/swagger-ui:v5.34.1
    restart: unless-stopped
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./openapi:/spec:ro
    ports:
      - "127.0.0.1:${SWAGGER_PORT:-8081}:8080"

volumes:
  pg_data:
  ollama_data:
  n8n_data:
  grafana_data:
