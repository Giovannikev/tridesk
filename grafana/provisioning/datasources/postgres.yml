apiVersion: 1
datasources:
  - name: P04 Postgres
    uid: p04-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: grafana_ro
    isDefault: true
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
